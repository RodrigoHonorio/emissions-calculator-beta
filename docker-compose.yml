services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: spire_postgis
    environment:
      POSTGRES_DB: spire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: