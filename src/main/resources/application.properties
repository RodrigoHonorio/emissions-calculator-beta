# Nome da Aplicação
spring.application.name=emissions-calculator-beta

# Configuração da Base de Dados PostGIS (Docker) - Porta alterada para 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/spire_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / Spatial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

tfl.api.url=https://api.erg.ic.ac.uk/AirQuality/Information/MonitoringSites/GroupName=London/Json